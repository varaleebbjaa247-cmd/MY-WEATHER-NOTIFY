<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งค่าระบบแจ้งเตือนฝนตก LINE</title>
    <style>
        body { font-family: 'Kanit', 'Tahoma', sans-serif; background-color: #f4f6f9; padding: 20px; }
        .card { max-width: 550px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 20px; }
        label { font-weight: bold; margin-top: 15px; display: block; color: #34495e; }
        select, input { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; font-size: 14px; }
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }
        button { width: 100%; background: #06c755; color: white; border: none; padding: 12px; margin-top: 25px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #05b34c; }
        .info-box { background: #e8f4fd; border-left: 4px solid #3498db; padding: 10px; margin-top: 15px; font-size: 13px; color: #2c3e50; }
    </style>
</head>
<body>

<div class="card">
    <h2>⚙️ ตั้งค่าการแจ้งเตือนฝนตก (ทั่วประเทศ)</h2>
    
    <label for="scale">1. เลือกสเกลระดับพื้นที่:</label>
    <select id="scale" onchange="handleScaleChange()">
        <option value="region">ระดับภูมิภาค</option>
        <option value="province">ระดับจังหวัด</option>
        <option value="district">ระดับอำเภอ/เขต</option>
        <option value="subdistrict">ระดับตำบล/แขวง</option>
    </select>

    <!-- ส่วนเลือกพื้นที่ตามสเกล -->
    <div id="selectorContainer">
        <!-- จะถูกเติมด้วย JavaScript -->
    </div>

    <label for="threshold">2. ตั้งค่าเกณฑ์ฝนตก (n %):</label>
    <input type="number" id="threshold" value="60" min="0" max="100">

    <div class="info-box" id="selectedInfo">
        📍 **พื้นที่ที่เลือก:** กำลังโหลดข้อมูล...
    </div>

    <button onclick="downloadConfig()">💾 ดาวน์โหลด config.json เพื่ออัปเดต GitHub</button>
</div>

<script>
// ข้อมูลพิกัดภูมิภาค (ตัวแทนภาค)
const REGIONS = [
    { name: "ภาคเหนือ", lat: 18.7883, lon: 98.9853 },
    { name: "ภาคกลาง", lat: 13.7563, lon: 100.5018 },
    { name: "ภาคตะวันออกเฉียงเหนือ (อีสาน)", lat: 16.4322, lon: 102.8236 },
    { name: "ภาคใต้", lat: 7.8804, lon: 98.3923 },
    { name: "ภาคตะวันออก", lat: 13.3611, lon: 100.9847 },
    { name: "ภาคตะวันตก", lat: 14.0227, lon: 99.5328 }
];

let rawData = []; // เก็บข้อมูล จังหวัด/อำเภอ/ตำบล ทั้งหมดจาก API
let selectedLocation = { name: "", lat: 0, lon: 0 };

// ดึงข้อมูลการปกครองไทยจาก Open-source API
async function fetchThailandData() {
    try {
        const response = await fetch('https://raw.githubusercontent.com/kongvut/thai-province-data/master/api_province_with_amphure_tambon.json');
        rawData = await response.json();
        handleScaleChange();
    } catch (error) {
        alert("ไม่สามารถโหลดข้อมูลที่อยู่อาศัยได้ กรุณาลองใหม่อีกครั้ง");
    }
}

function handleScaleChange() {
    const scale = document.getElementById("scale").value;
    const container = document.getElementById("selectorContainer");
    container.innerHTML = "";

    if (scale === "region") {
        let html = `<label>เลือกภูมิภาค:</label><select id="regionSelect" onchange="updateRegionSelection()">`;
        REGIONS.forEach((r, idx) => {
            html += `<option value="${idx}">${r.name}</option>`;
        });
        html += `</select>`;
        container.innerHTML = html;
        updateRegionSelection();

    } else if (scale === "province") {
        let html = `<label>เลือกจังหวัด:</label><select id="provinceSelect" onchange="updateProvinceSelection()">`;
        rawData.forEach((p) => {
            html += `<option value="${p.id}">${p.name_th}</option>`;
        });
        html += `</select>`;
        container.innerHTML = html;
        updateProvinceSelection();

    } else if (scale === "district") {
        let html = `
            <div class="row">
                <div>
                    <label>จังหวัด:</label>
                    <select id="provinceSelect" onchange="loadAmphures()"></select>
                </div>
                <div>
                    <label>อำเภอ/เขต:</label>
                    <select id="amphureSelect" onchange="updateDistrictSelection()"></select>
                </div>
            </div>`;
        container.innerHTML = html;
        fillProvinces();
        loadAmphures();

    } else if (scale === "subdistrict") {
        let html = `
            <label>จังหวัด:</label>
            <select id="provinceSelect" onchange="loadAmphures()"></select>
            <div class="row">
                <div>
                    <label>อำเภอ/เขต:</label>
                    <select id="amphureSelect" onchange="loadTambons()"></select>
                </div>
                <div>
                    <label>ตำบล/แขวง:</label>
                    <select id="tambonSelect" onchange="updateSubdistrictSelection()"></select>
                </div>
            </div>`;
        container.innerHTML = html;
        fillProvinces();
        loadAmphures();
    }
}

function fillProvinces() {
    const pSelect = document.getElementById("provinceSelect");
    pSelect.innerHTML = "";
    rawData.forEach((p) => {
        pSelect.innerHTML += `<option value="${p.id}">${p.name_th}</option>`;
    });
}

function loadAmphures() {
    const pId = parseInt(document.getElementById("provinceSelect").value);
    const province = rawData.find(p => p.id === pId);
    const aSelect = document.getElementById("amphureSelect");
    aSelect.innerHTML = "";
    
    province.amphure.forEach((a) => {
        aSelect.innerHTML += `<option value="${a.id}">${a.name_th}</option>`;
    });

    if (document.getElementById("scale").value === "district") {
        updateDistrictSelection();
    } else {
        loadTambons();
    }
}

function loadTambons() {
    const pId = parseInt(document.getElementById("provinceSelect").value);
    const aId = parseInt(document.getElementById("amphureSelect").value);
    const province = rawData.find(p => p.id === pId);
    const amphure = province.amphure.find(a => a.id === aId);
    const tSelect = document.getElementById("tambonSelect");
    tSelect.innerHTML = "";

    amphure.tambon.forEach((t) => {
        tSelect.innerHTML += `<option value="${t.id}">${t.name_th}</option>`;
    });

    updateSubdistrictSelection();
}

// อัปเดตพิกัดตำแหน่งที่เลือก
function updateRegionSelection() {
    const idx = document.getElementById("regionSelect").value;
    selectedLocation = REGIONS[idx];
    displayInfo();
}

function updateProvinceSelection() {
    const pId = parseInt(document.getElementById("provinceSelect").value);
    const p = rawData.find(item => item.id === pId);
    // ใช้พิกัดแทนของอำเภอแรกในจังหวัด
    const sampleAmphure = p.amphure[0];
    selectedLocation = {
        name: `จังหวัด${p.name_th}`,
        lat: sampleAmphure.latitude || p.amphure[0].tambon[0].latitude,
        lon: sampleAmphure.longitude || p.amphure[0].tambon[0].longitude
    };
    displayInfo();
}

function updateDistrictSelection() {
    const pId = parseInt(document.getElementById("provinceSelect").value);
    const aId = parseInt(document.getElementById("amphureSelect").value);
    const p = rawData.find(item => item.id === pId);
    const a = p.amphure.find(item => item.id === aId);
    
    selectedLocation = {
        name: `อำเภอ${a.name_th} จ.${p.name_th}`,
        lat: a.latitude || a.tambon[0].latitude,
        lon: a.longitude || a.tambon[0].longitude
    };
    displayInfo();
}

function updateSubdistrictSelection() {
    const pId = parseInt(document.getElementById("provinceSelect").value);
    const aId = parseInt(document.getElementById("amphureSelect").value);
    const tId = parseInt(document.getElementById("tambonSelect").value);
    const p = rawData.find(item => item.id === pId);
    const a = p.amphure.find(item => item.id === aId);
    const t = a.tambon.find(item => item.id === tId);

    selectedLocation = {
        name: `ตำบล${t.name_th} อ.${a.name_th} จ.${p.name_th}`,
        lat: t.latitude,
        lon: t.longitude
    };
    displayInfo();
}

function displayInfo() {
    document.getElementById("selectedInfo").innerHTML = `
        📍 <strong>พิกัดที่เลือก:</strong> ${selectedLocation.name}<br>
        🌐 <strong>Lat/Lon:</strong> ${selectedLocation.lat}, ${selectedLocation.lon}
    `;
}

function downloadConfig() {
    const thresholdVal = parseInt(document.getElementById("threshold").value);

    const configData = {
        threshold: thresholdVal,
        location: selectedLocation
    };

    const blob = new Blob([JSON.stringify(configData, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "config.json";
    a.click();
}

// เริ่มต้นโหลดข้อมูลเมื่อเปิดหน้าเว็บ
fetchThailandData();
</script>

</body>
</html>
