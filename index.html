let selectedLocation = { name: "", lat: 0, lon: 0 };

function handleScaleChange() {
    const scale = document.getElementById("scale").value;
    const container = document.getElementById("selectorContainer");
    container.innerHTML = "";

    if (scale === "region") {
        let html = `<label>เลือกภูมิภาค:</label><select id="regionSelect" onchange="updateRegionSelection()">`;
        REGIONS.forEach((r, idx) => { html += `<option value="${idx}">${r.name}</option>`; });
        html += `</select>`;
        container.innerHTML = html;
        updateRegionSelection();

    } else if (scale === "province") {
        let html = `<label>เลือกจังหวัด:</label><select id="provinceSelect" onchange="updateProvinceSelection()">`;
        PROVINCES.forEach((p, idx) => { html += `<option value="${idx}">${p.name}</option>`; });
        html += `</select>`;
        container.innerHTML = html;
        updateProvinceSelection();

    } else if (scale === "custom") {
        let html = `
            <label>ชื่อสถานที่ / อำเภอ / ตำบล:</label>
            <input type="text" id="customName" placeholder="เช่น อ.ดอนตาล" oninput="updateCustomSelection()">
            <div class="row" style="display:flex; gap:10px; margin-top:10px;">
                <div style="flex:1;">
                    <label>Latitude (ละติจูด):</label>
                    <input type="number" step="any" id="customLat" placeholder="เช่น 16.5436" oninput="updateCustomSelection()">
                </div>
                <div style="flex:1;">
                    <label>Longitude (ลองจิจูด):</label>
                    <input type="number" step="any" id="customLon" placeholder="เช่น 104.7236" oninput="updateCustomSelection()">
                </div>
            </div>`;
        container.innerHTML = html;
        updateCustomSelection();
    }
}

function updateRegionSelection() {
    const idx = document.getElementById("regionSelect").value;
    selectedLocation = REGIONS[idx];
    displayInfo();
}

function updateProvinceSelection() {
    const idx = document.getElementById("provinceSelect").value;
    const p = PROVINCES[idx];
    selectedLocation = {
        name: `จังหวัด${p.name}`,
        lat: p.lat,
        lon: p.lon
    };
    displayInfo();
}

function updateCustomSelection() {
    const name = document.getElementById("customName").value || "พื้นที่กำหนดเอง";
    const lat = parseFloat(document.getElementById("customLat").value) || 0;
    const lon = parseFloat(document.getElementById("customLon").value) || 0;
    selectedLocation = { name, lat, lon };
    displayInfo();
}

function displayInfo() {
    document.getElementById("selectedInfo").innerHTML = `
        📍 <strong>พื้นที่ที่เลือก:</strong> ${selectedLocation.name}<br>
        🌐 <strong>พิกัด (Lat, Lon):</strong> ${selectedLocation.lat}, ${selectedLocation.lon}
    `;
}

async function saveToGitHub() {
    const token = document.getElementById("githubToken").value.trim();
    const statusBox = document.getElementById("statusBox");

    if (!token) {
        statusBox.style.color = "red";
        statusBox.innerText = "⚠️ กรุณากรอก GitHub Personal Access Token ก่อนบันทึกครับ";
        return;
    }

    statusBox.style.color = "#3498db";
    statusBox.innerText = "⏳ กำลังส่งข้อมูลไปยัง GitHub...";

    const thresholdVal = parseInt(document.getElementById("threshold").value);
    const configData = {
        threshold: thresholdVal,
        location: selectedLocation
    };

    const contentString = JSON.stringify(configData, null, 2);
    // แปลงข้อความ JSON เป็น Base64 (รองรับอักขระภาษาไทย)
    const contentBase64 = btoa(unescape(encodeURIComponent(contentString)));

    const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;

    try {
        // 1. ดึง sha ของไฟล์ config.json เดิม
        let currentSha = null;
        const getRes = await fetch(url, {
            headers: {
                "Authorization": `token ${token}`,
                "Accept": "application/vnd.github.v3+json"
            }
        });

        if (getRes.ok) {
            const fileData = await getRes.json();
            currentSha = fileData.sha;
        }

        // 2. ส่งคำสั่งบันทึกอัปเดตไฟล์
        const bodyData = {
            message: "Update config.json via web app",
            content: contentBase64
        };
        if (currentSha) {
            bodyData.sha = currentSha;
        }

        const putRes = await fetch(url, {
            method: "PUT",
            headers: {
                "Authorization": `token ${token}`,
                "Content-Type": "application/json",
                "Accept": "application/vnd.github.v3+json"
            },
            body: JSON.stringify(bodyData)
        });

        if (putRes.ok) {
            statusBox.style.color = "#2ecc71";
            statusBox.innerText = "✅ บันทึกข้อมูลลง GitHub เรียบร้อยแล้ว!";
        } else {
            const errData = await putRes.json();
            statusBox.style.color = "#e74c3c";
            statusBox.innerText = "❌ บันทึกไม่สำเร็จ: " + (errData.message || "Token ไม่ถูกต้อง หรือไม่มีสิทธิ์");
        }
    } catch (err) {
        statusBox.style.color = "#e74c3c";
        statusBox.innerText = "❌ เกิดข้อผิดพลาด: " + err.message;
    }
}
